server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads up to the backend's 10MB limit (+ headroom).
    client_max_body_size 12m;

    # Proxy API + stored assets to the backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/ {
        proxy_pass http://backend:5010;
        proxy_set_header Host $host;
    }

    # Hashed build assets can cache forever; index.html must always be
    # revalidated so a fresh deploy is never masked by a stale cached shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
