# Apollo Design — full local stack.
#   Frontend (nginx)  → http://localhost:5180
#   Backend  (express) → http://localhost:5010
#   MongoDB           → localhost:27020
#
# Ports are chosen to avoid the other local projects (waas / tsultrim / headless / erp).
# Optional API keys are read from a root .env file (see .env.example); without them
# the app still runs with the built-in mock AI + placeholder images.
#
#   docker compose up --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - apollo-mongo-data:/data/db

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5010
      CLIENT_ORIGIN: http://localhost:5180
      MONGODB_URI: mongodb://mongo:27017/apollo_design
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-pexels}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    ports:
      - "5010:5010"
    volumes:
      # Persist uploaded assets & exports on the host.
      - ./server/storage:/app/storage

  frontend:
    build: ./client
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5180:80"

volumes:
  apollo-mongo-data:
